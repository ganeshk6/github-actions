name: Validate Files
on: workflow_dispatch

jobs:
  validate-files:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4

      - name: Validate html files
        run: test -f index.html

      - name: Validate js file
        run: test -f script.js

      - name: Validate js code
        run: node --check script.js
